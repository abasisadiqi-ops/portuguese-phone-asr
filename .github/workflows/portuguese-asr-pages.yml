name: Build or publish Portuguese ASR PWA

on:
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "Publish ONLY isolated ASR web app publicly to GitHub Pages?"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: portuguese-asr-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify and extract audited isolated source
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' '6abeb868773aad1374d899973499d77700aa6d896de3a779728e48d8d334b34f' 'phone-asr-source-v134.zip' | sha256sum -c -
          mkdir -p /tmp/portuguese-asr-pwa
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          src=Path("phone-asr-source-v134.zip")
          with ZipFile(src) as z:
              if 'src/scoring.mjs' not in z.namelist() or 'src/startup.mjs' not in z.namelist(): raise SystemExit('Missing vetted Tiny/Base scorer or startup diagnostics')
              entries=z.infolist()
              if len(entries)>60: raise SystemExit("Too many archive entries")
              if sum(x.file_size for x in entries)>2000000: raise SystemExit("Unexpected archive size")
              for entry in entries:
                  n=entry.filename
                  parts=PurePosixPath(n).parts
                  kind=(entry.external_attr >> 16) & 0o170000
                  if not parts or n.startswith("/") or "\\" in n or ".." in parts or kind==0o120000 or (kind not in (0,0o100000,0o040000)):
                      raise SystemExit("Unsafe path or file type: "+n)
                  if any(part.upper() in ("LEARNING","HISTORY","WORKING","NODE_MODULES") for part in parts) or "PROGRAM_STATE" in n.upper():
                      raise SystemExit("Private or generated content: "+n)
              z.extractall("/tmp/portuguese-asr-pwa")
          PY
          test -f /tmp/portuguese-asr-pwa/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests and compile standalone website
        working-directory: /tmp/portuguese-asr-pwa
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
          node tools/check_dist.mjs
          grep -q 'Whisper Base' dist/index.html
          grep -q 'Startup diagnostics' dist/index.html
          grep -q "navigation_strategy:'cache_first'" dist/sw.js
          grep -rq 'portuguese-asr-startup-v1' dist/assets/
          grep -rq 'onnx-community/whisper-base' dist/assets/

      - name: Archive build results (not model weights or recordings)
        uses: actions/upload-artifact@v4
        with:
          name: portuguese-asr-site-build
          path: /tmp/portuguese-asr-pwa/dist/
          retention-days: 7
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: ${{ inputs.deploy_pages && github.ref == 'refs/heads/main' }}
        uses: actions/configure-pages@v5

      - name: Stage website for Pages only when authorized
        if: ${{ inputs.deploy_pages && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/portuguese-asr-pwa/dist/

  publish:
    if: ${{ inputs.deploy_pages && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy isolated website
        id: deploy
        uses: actions/deploy-pages@v4
